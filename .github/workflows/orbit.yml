name: Orbit

on:
  schedule:
    - cron: "17 6 * * *" # every morning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Draw the orbit
        uses: falahsheikh/ascii-orbit@v1

      - name: Publish it on the output branch
        run: |
          cd dist
          git init --quiet --initial-branch output
          git add orbit.svg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Redraw orbit"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ github.token }}
